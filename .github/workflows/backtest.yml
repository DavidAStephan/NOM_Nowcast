name: Refresh backtest

# Runs the backtest grid (pseudo-real-time before the first captured
# NOM vintage, genuinely vintage-aware after) INCLUDING the four
# Bayesian models, and commits the scored snapshot back to main.
# Triggered manually or on the first of each month. The render
# workflow reads `data/backtest_scored.rds`; it does NOT recompute.
#
# cmdstanr / cmdstan are installed here because the production headline
# is `bayes_kalman`: a refresh without it silently drops the production
# model from the public backtest page (which is what happened between
# July and October 2026).

on:
  schedule:
    - cron: "0 18 1 * *"        # 1st of each month, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "backtest-refresh"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: ${{ github.workspace }}/R-lib
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglpk40 \
            libxml2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libsodium-dev \
            libicu-dev \
            g++ make

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-jammy-${{ runner.os }}-bayes-v1-${{ hashFiles('.github/workflows/headline.yml') }}
          restore-keys: |
            r-jammy-${{ runner.os }}-bayes-v1-

      - name: Cache cmdstan toolchain
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-2.39.0-${{ runner.os }}-jammy

      - name: Install R packages (RSPM Linux binaries + cmdstanr)
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), showWarnings = FALSE, recursive = TRUE)
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"),
            Ncpus = 2,
            install.packages.compile.from.source = "never",
            install.packages.check.source = "no",
            HTTPUserAgent = sprintf(
              "R/%s R (%s)", getRversion(),
              paste(getRversion(), R.version$platform, R.version$arch,
                    R.version$os, sep = "/")
            )
          )
          pkgs <- c(
            "config", "DBI", "dplyr", "duckdb", "fixest", "fs",
            "ggplot2", "glue", "gt", "httr2", "jsonlite", "KFAS",
            "lubridate", "purrr", "readabs", "readr", "readxl",
            "rvest", "scales", "stringr", "tarchetypes", "targets",
            "tibble", "tidyr", "tsibble", "yaml", "cli", "digest", "sass",
            "posterior", "distributional"
          )
          missing <- pkgs[!vapply(pkgs, requireNamespace,
                                  logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing)
          if (!requireNamespace("cmdstanr", quietly = TRUE)) {
            install.packages("cmdstanr",
              repos = c("https://stan-dev.r-universe.dev", getOption("repos")))
          }
        shell: Rscript {0}

      - name: Install cmdstan toolchain (if not cached)
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = 4)
        shell: Rscript {0}

      - name: Set cmdstan path
        run: |
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          cmdstanr::set_cmdstan_path("~/.cmdstan/cmdstan-2.39.0")
        shell: Rscript {0}

      - name: Run refresh_backtest.R (with Bayesian models)
        # Plain shell step: Rscript finds the cached library via the
        # job-level R_LIBS_USER env. (A bare `.libPaths(...)` R line in a
        # bash `run:` block was crashing this step — bash can't parse `c(`.)
        env:
          NN_REFRESH_BAYES: "1"
        run: Rscript scripts/refresh_backtest.R

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/backtest_scored.rds data/backtest_meta.rds 2>/dev/null; then
            echo "No backtest changes to commit."
            exit 0
          fi
          git add data/backtest_scored.rds data/backtest_meta.rds
          git commit -m "Refresh backtest snapshot ($(date -u +%Y-%m-%d))"
          # Other scheduled workflows commit to main too; rebase so a
          # concurrent capture/headline commit doesn't make the push fail.
          git pull --rebase origin main
          git push
