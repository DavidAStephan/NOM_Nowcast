name: Render and deploy

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC ~= 16:00 AEST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "stan/**"
      - "*.qmd"
      - "_quarto.yml"
      - "custom.scss"
      - "config.yml"
      - "_targets.R"
      - ".github/workflows/render.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    # Pin to ubuntu-22.04 (jammy) so Posit Package Manager binaries
    # match the runner's libc / R ABI. ubuntu-latest moved to 24.04
    # which had patchy binary coverage at the time of writing.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: ${{ github.workspace }}/R-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-jammy-${{ runner.os }}-v3-${{ hashFiles('.github/workflows/render.yml') }}
          restore-keys: |
            r-jammy-${{ runner.os }}-v3-

      # Skip pak/setup-r-dependencies entirely — they were compiling
      # everything from source via the default CRAN repo. install.packages()
      # pointed at the RSPM Linux URL pulls pre-built binaries for jammy
      # in seconds instead of minutes.
      # RSPM's __linux__/jammy/ URL serves precompiled binaries disguised
      # as source tarballs; plain install.packages() pulls them in seconds.
      # `setup-r-dependencies`'s pak path was instead resolving to CRAN
      # source tarballs and compiling for ~30 min before timing out.
      - name: Install R packages (RSPM Linux binaries)
        run: |
          dir.create(Sys.getenv("R_LIBS_USER"), showWarnings = FALSE, recursive = TRUE)
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"),
            Ncpus = 2,
            install.packages.compile.from.source = "never",
            install.packages.check.source = "no",
            HTTPUserAgent = sprintf(
              "R/%s R (%s)", getRversion(),
              paste(getRversion(), R.version$platform, R.version$arch,
                    R.version$os, sep = "/")
            )
          )
          pkgs <- c(
            "config", "DBI", "dplyr", "duckdb", "fixest", "fs",
            "ggplot2", "glue", "gt", "httr2", "jsonlite", "KFAS",
            "lubridate", "purrr", "quarto", "readabs", "readr", "readxl",
            "rvest", "scales", "stringr", "tarchetypes", "targets",
            "tibble", "tidyr", "tsibble", "yaml", "cli", "digest", "sass"
          )
          missing <- pkgs[!vapply(pkgs, requireNamespace,
                                  logical(1), quietly = TRUE)]
          cat("Need to install:", length(missing), "of",
              length(pkgs), "packages\n")
          if (length(missing)) install.packages(missing)
          for (p in pkgs) {
            if (!requireNamespace(p, quietly = TRUE)) {
              stop("Failed to install: ", p)
            }
          }
          cat("All packages installed.\n")
        shell: Rscript {0}

      - name: Run pipeline (fetch data, fit models, populate targets cache)
        run: |
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          targets::tar_make()
        shell: Rscript {0}

      - name: Render Quarto site
        run: quarto render --to html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
