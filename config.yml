default:
  # ----- Paths -----
  paths:
    raw: "data/raw"
    vintages: "data/vintages"
    processed: "data/processed"
    duckdb: "data/vintages/nomnowcast.duckdb"
    cache: ".cache"

  # ----- Run-time -----
  run:
    asof_date: ~          # NULL => Sys.Date(); override for vintage replay
    log_level: "info"
    parallel_workers: 4
    http_retries: 4
    http_backoff_seconds: [1, 4, 16, 64]
    user_agent: "nomnowcast (+https://github.com/your-org/nom-nowcast)"

  # ----- Source endpoints -----
  # ABS time-series IDs change occasionally. The fetchers look these up by
  # catalogue + table label first, and fall back to these IDs if the lookup
  # fails. Update here when ABS reissues a table.
  abs:
    # Modern ABS catalogues use slug-based identifiers, not legacy
    # cat-numbers, and most population releases are now Excel data
    # cubes rather than time-series spreadsheets. Update slugs here if
    # the ABS re-namespaces a release.
    oad_slug: "overseas-arrivals-and-departures-australia"
    # Data-cube files used by the OAD fetcher:
    #   3401015.xlsx — Total arrivals by state and visa group
    #   3401016.xlsx — Total departures by state and visa group
    # Sheet "Table 15.9" / "Table 16.9" = Australia-wide.
    pop_slug: "national-state-and-territory-population"
    # Data-cube file used by the (quarterly) NOM fetcher:
    #   310101.xlsx — Population and components of change, national
    # NOM enters as the "Net overseas migration" component series.
    nom_slug_quarterly: "national-state-and-territory-population"
    nom_quarterly_file: "310101.xlsx"
    # Annual NOM-by-visa-group (used by pi estimation):
    nom_slug_annual: "overseas-migration"
    nom_annual_visa_file: "34070DO004_202425.xlsx"
    publication_lag_days:
      oad: 35      # OAD released ~5 weeks after reference month
      nom: 183     # NOM released ~6 months after reference quarter

  # Secondary sources. As of 2026-05, DHA, Department of Education, and
  # BITRE have all migrated away from static CSV/XLSX downloads toward
  # interactive Power BI dashboards and PDF-only releases. The URLs
  # below point at the current landing pages and the fetchers degrade
  # gracefully when no downloadable files are found. For Phase 2 these
  # sources should be re-wired against the data.gov.au open-data API
  # (or equivalent) — see README "Limitations".
  datagov:
    # data.gov.au CKAN endpoint. Used by the DHA visa-grant fetcher.
    # Other base URLs (data.gov.au/api/3/... or data.gov.au/api/...)
    # return 404; only the "/data/" path is wired up.
    ckan_endpoint: "https://data.gov.au/data/api/3/action/package_search"
    dha_queries:
      - "Student visa program"
      - "Visitor visa program"
      - "Temporary Graduate visa program"
      - "Temporary Work (skilled) visa program"
      - "Working Holiday Maker visa program"

  homeaffairs:
    visa_grants_index: "https://www.homeaffairs.gov.au/research-and-statistics/statistics/visa-statistics"
    twh_index:         "https://www.homeaffairs.gov.au/research-and-statistics/statistics/visa-statistics/live/temporary-entrants-in-australia"
    wh_index:          "https://www.homeaffairs.gov.au/research-and-statistics/statistics/visa-statistics/work"
    sub_page_keywords: ["visit", "study", "live", "work", "migration-program"]
    publication_lag_days: 45

  education:
    students_index: "https://www.education.gov.au/international-education-data-and-research"
    publication_lag_days: 35

  bitre:
    airline_activity_index: "https://www.bitre.gov.au/statistics/aviation"
    publication_lag_days: 60

  # ----- Panel -----
  panel:
    # Visa-grant data from data.gov.au CKAN comes at financial-year
    # frequency; the panel builder spreads it across the four FY
    # quarters. "proportional" weights each quarter by OAD long-term
    # arrivals in the same category for that quarter (better within-
    # year signal). "equal" gives 1/4 to each quarter. Defaults to
    # proportional.
    vg_disagg_strategy: "proportional"

  # ----- Categories -----
  categories:
    # Canonical taxonomy used downstream. See R/clean/category_map.R for the
    # mapping from raw visa codes / OAD visa groups / DHA visa subclasses.
    levels:
      - student
      - skilled
      - working_holiday
      - family
      - nz_citizen
      - bridging
      - other_temp
      - permanent
      - returning_au
      - other

  # ----- pi (classification probability) -----
  pi:
    # Quarters of observation required before a cohort is "complete" enough
    # for empirical pi estimation. ABS uses 12/16 so 16 months ~ 6 quarters.
    completion_quarters: 6
    smoother: "loess"      # one of: loess, hp, locallinear, none
    loess_span: 0.50       # wider window — Phase 1 raw pi is volatile (~0.6-1.2)
    hp_lambda: 1600
    regime_breaks:
      - "2020-03-01"       # border closure
      - "2022-03-01"       # reopening
    floor: 0.0
    ceiling: 1.20          # 1.0 in theory but OAD/NOM accounting can push slightly above
    # Forward-projection strategy for cohorts past the completion cutoff.
    # "latest"   — carry forward the most recent smoothed value (fragile)
    # "median_n" — use the median of the last N quarters within the current regime
    # "mean_n"   — use the mean of the last N quarters within the current regime
    projection: "median_n"
    projection_window: 8   # quarters

  # ----- Modelling -----
  models:
    kalman_multi:
      # Phase 2 v1.0 multivariate SSM (OAD + visa grants on a shared
      # latent log-arrivals state). Set `enabled: false` to fall back
      # to the univariate Phase 1 Kalman for the total category.
      enabled: true
      visa_lead_quarters: 1
      # v2.0: add log(NOM) as a third observation row. The Kalman then
      # produces a NOM forecast directly via the calibrated alpha_n
      # offset, bypassing the empirical-pi extrapolation. Headline
      # uses the multi-SSM NOM forecast when this is TRUE.
      include_nom: true
      # v3.0 explored making alpha_n a slow random-walk state. That
      # model has weak identification with the level state and the
      # backtest was worse than v2.0 across every horizon -- so it
      # remains a config-flagged opt-in. Production stays on v2.0
      # static alpha. See STATUS.md "Negative results" for context.
      nom_alpha_time_varying: false
      # v4.0 — parametric Gamma lag from visa grants to arrivals.
      # When enabled, state augments with K lagged copies of the
      # level state and the visa observation row Z[2,] uses Gamma
      # weights instead of loading on the current level only.
      #   alpha, beta: Gamma(shape, rate) parameters
      #   k_max:       maximum forward lag in quarters
      # Defaults give mode at lag 1q with a 4q tail (typical
      # student-visa-grant -> arrival pipeline).
      gamma_lag:
        enabled: true
        alpha: 2.0
        beta:  1.0
        k_max: 4
        # v5.0 -- pick (alpha, beta) by panel log-likelihood over a
        # small grid. Adds ~20-30s to each model fit. Set to FALSE
        # to fall back to the fixed (alpha, beta) above.
        grid_search: true
        alpha_grid: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0]
        beta_grid:  [0.5, 1.0, 1.5, 2.0]
    kalman:
      # Seasonal period at the quarterly modelling frequency. 4 = annual
      # seasonality in quarters. The legacy default of 12 (a monthly
      # seasonal applied to quarterly data) is over-parameterised on a
      # 200-obs panel and causes the multi-SSM optimiser to collapse.
      seasonal_period: 4
      include_ar1_irregular: true
      categories_to_fit: ~     # NULL => all
      # Trend specification used in the state equation:
      #   "local_linear" — level + slope, both random-walk (forecasts
      #                    extrapolate any recent trend; volatile)
      #   "level_only"   — random walk in level only (forecasts flat)
      #   "damped"       — level + AR(1) slope, |phi| < 1 (slope decays
      #                    in forecasts; the standard choice for
      #                    nowcasting noisy migration flows)
      trend_type: "damped"
      damping_phi: 0.85
    bridge:
      max_lag_quarters: 4
    stan:
      chains: 4
      iter_warmup: 1000
      iter_sampling: 1000
      adapt_delta: 0.95
      max_treedepth: 12

  # ----- Backtesting -----
  backtest:
    start: "2010-01-01"
    end: ~                 # NULL => last completed quarter at asof_date
    horizons:              # quarters relative to evaluation date
      - -2                 # backcast
      - -1
      -  0                 # nowcast
      -  1                 # 1-step forecast
    regimes:
      pre_covid:  ["1900-01-01", "2019-12-31"]
      covid:      ["2020-01-01", "2021-12-31"]
      post_covid: ["2022-01-01", "2099-12-31"]
    save_predictions: true

  # ----- Reporting -----
  reporting:
    asof_label_fmt: "%d %B %Y"
    headline_ci: 0.80
    secondary_ci: 0.95
